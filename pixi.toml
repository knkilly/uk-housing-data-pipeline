[workspace]
name = "housing-analytics"
version = "1.0.0"
description = "UK Housing Analytics Platform — DuckDB medallion pipeline + FastAPI/React dashboard"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
python = ">=3.11,<3.13"
duckdb = ">=1.0.0"
pandas = ">=2.1.0"
pyarrow = ">=14.0.0"
requests = ">=2.31.0"

[tasks]
download = "python scripts/download_ons_postcodes.py"
bronze   = "python scripts/bronze_ingestion.py"
silver   = "python scripts/silver_transformation.py"
gold     = "python scripts/gold_aggregation.py"
process  = "python scripts/process_layers.py"

[feature.dev.dependencies]
ipython = ">=8.0.0"
jupyter = ">=1.0.0"
matplotlib = ">=3.8.0"
seaborn = ">=0.13.0"

[feature.dev.tasks]
notebook = "jupyter notebook"

[feature.api.dependencies]
python  = ">=3.11"
fastapi = ">=0.111.0"
uvicorn = ">=0.29.0"
duckdb  = ">=0.10.0"
pandas  = ">=2.0.0"

[feature.api.tasks]
api      = "uvicorn app.main:app --reload --port 8000 --app-dir ."
api-prod = "uvicorn app.main:app --port 8000 --app-dir ."

[environments]
dev = ["dev"]
api = { features = ["api"], solve-group = "default" }
